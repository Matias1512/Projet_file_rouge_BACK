name: CI/CD - Spring Boot

on:
  push:
    branches: [ main, develop, CI/CD ]
  pull_request:
    branches: [ main, develop, CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven # Change to 'gradle' si tu utilises Gradle

      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests
        working-directory: SchoolDev

      # - name: 🧪 Run Tests
      #   run: mvn test

      # - name: 📦 Save JAR Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-jar
      #     path: target/*.jar

    docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Set Docker Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: 📦 Build Docker Image
        run: |
          cd SchoolDev  # ✅ Se déplacer dans le dossier SchoolDev
          docker build -t matias151/schooldev:${{ env.IMAGE_TAG }} -f Dockerfile .
          docker tag matias151/schooldev:${{ env.IMAGE_TAG }} matias151/schooldev:latest

      - name: 📤 Push Docker Image
        run: |
          docker push matias151/schooldev:${{ env.IMAGE_TAG }}
          docker push matias151/schooldev:latest
          