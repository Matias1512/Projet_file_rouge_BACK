name: CI/CD - Spring Boot

on:
  push:
    branches: [ main, develop, CI/CD ]
  pull_request:
    branches: [ main, develop, CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven # Change to 'gradle' si tu utilises Gradle

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        working-directory: SchoolDev
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
             -Dsonar.projectKey=Matias1512_Projet_file_rouge_BACK \
             -Dsonar.organization=matias1512 \
             -Dsonar.host.url=https://sonarcloud.io
      # - name: 🧪 Run Tests
      #   run: mvn test

      # - name: 📦 Save JAR Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-jar
      #     path: target/*.jar

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests
        working-directory: SchoolDev  # 📌 Compile le projet et génère `target/`

      - name: 📂 Vérifier la présence du fichier .jar
        run: ls -lh SchoolDev/target  # 📌 Affiche les fichiers dans target/

      - name: 🐳 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Set Docker Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: 📦 Build Docker Image
        run: |
          docker build -t matias151/schooldev_back:${{ env.IMAGE_TAG }} -f ./SchoolDev/Dockerfile ./SchoolDev
          docker tag matias151/schooldev_back:${{ env.IMAGE_TAG }} matias151/schooldev_back:latest

      - name: 📤 Push Docker Image
        run: |
          docker push matias151/schooldev_back:${{ env.IMAGE_TAG }}
          docker push matias151/schooldev_back:latest