  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Set Docker Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: 📦 Build Docker Image
        run: |
          docker build -t matias151/schooldev:${{ env.IMAGE_TAG }} -f SchoolDev/Dockerfile SchoolDev
          docker tag matias151/schooldev:${{ env.IMAGE_TAG }} matias151/schooldev:latest

      - name: 📤 Push Docker Image
        run: |
          docker push matias151/schooldev:${{ env.IMAGE_TAG }}
          docker push matias151/schooldev:latest
