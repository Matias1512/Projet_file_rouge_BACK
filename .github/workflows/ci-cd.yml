name: CI/CD - Spring Boot

on:
  push:
    branches: [ develop, CI/CD ]
  pull_request:
    branches: [ develop, CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven

      - name: 🗃️ Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🧹 Clean before build
        run: mvn clean
        working-directory: SchoolDev

      - name: 🧪 Run tests and analyze with SonarCloud
        working-directory: SchoolDev
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: 📂 Vérifier le contenu du rapport JaCoCo
        run: ls -lh SchoolDev/target/site/jacoco

  
  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: Set branch name (sanitize for Docker tag)
        run: |
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '/' '-')
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests
        working-directory: SchoolDev  # 📌 Compile le projet et génère `target/`

      - name: 📂 Vérifier la présence du fichier .jar
        run: ls -lh SchoolDev/target  # 📌 Affiche les fichiers dans target/

      - name: 🐳 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Set Docker Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: 📦 Build Docker Image
        run: |
          docker build -t matias151/schooldev_back:${{ env.IMAGE_TAG }} \
                       -t matias151/schooldev_back:${{ env.BRANCH_NAME }} \
                       -f ./SchoolDev/Dockerfile ./SchoolDev
          docker tag matias151/schooldev_back:${{ env.IMAGE_TAG }} matias151/schooldev_back:latest

      - name: 📤 Push Docker Image
        run: |
          docker push matias151/schooldev_back:${{ env.IMAGE_TAG }}
          docker push matias151/schooldev_back:${{ env.BRANCH_NAME }}
          docker push matias151/schooldev_back:latest
