name: CI/CD - Spring Boot & Docker

on:
  push:
    branches: [ main, develop, CI/CD ]
  pull_request:
    branches: [ main, develop, CI/CD ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -DskipTests
        working-directory: SchoolDev

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Docker Image Tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: 🐳 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Vérifier Dockerfile
        run: ls -lh SchoolDev/Dockerfile

      - name: 📦 Build Docker Image
        run: |
          docker build -t matias151/schooldev_back:${{ env.IMAGE_TAG }} -f ./SchoolDev/Dockerfile ./SchoolDev
          docker tag matias151/schooldev_back:${{ env.IMAGE_TAG }} matias151/schooldev_back:latest

      - name: 📤 Push Docker Image
        run: |
          docker push matias151/schooldev_back:${{ env.IMAGE_TAG }}
          docker push matias151/schooldev_back:latest
